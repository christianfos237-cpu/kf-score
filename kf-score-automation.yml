name: KF SCORE - Automatisation des matchs

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kf-score-automation
  cancel-in-progress: true

jobs:
  publish-match-events:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vérifier les événements en continu pendant la session
        env:
          AUTOMATION_SECRET: ${{ secrets.KF_AUTOMATION_SECRET }}
        shell: bash
        run: |
          set -u
          if [ -z "$AUTOMATION_SECRET" ]; then
            echo "Secret KF_AUTOMATION_SECRET manquant dans GitHub Actions."
            exit 1
          fi

          start_time=$(date +%s)
          echo "Démarrage de la surveillance KF SCORE."

          while true; do
            now=$(date +%s)
            elapsed=$((now - start_time))
            if [ "$elapsed" -ge 255 ]; then
              echo "Fin de cette session de surveillance."
              break
            fi

            echo "Vérification des buts et cartons rouges..."
            curl --silent --show-error --fail-with-body \
              --max-time 20 \
              --request POST \
              --header "X-Automation-Secret: ${AUTOMATION_SECRET}" \
              "https://kf-score-3.onrender.com/api/automation/run" \
              || echo "Vérification échouée ; nouvelle tentative au prochain cycle."

            sleep 15
          done
